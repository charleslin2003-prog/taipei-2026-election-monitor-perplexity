name: Evidence tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "8,23,38,53 * * * *"

permissions:
  contents: read

concurrency:
  group: tracker-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate manual data
        run: python -c "import json,sys;sys.path.insert(0,'scripts');from collect import validate_reviews,validate_profiles;validate_reviews(json.load(open('reviews.json',encoding='utf-8')));validate_profiles(json.load(open('profiles.json',encoding='utf-8')))"
      - name: JavaScript syntax
        run: node --check site/app.js

  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and build static site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/pipeline.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
